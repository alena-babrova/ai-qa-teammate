# Cursor Agent CLI (cursor-agent) runs ONLY in this GitHub Actions workflow.
# Locally, use Cursor IDE with .cursor/rules and .cursor/mcp.json — do not run headless agent on dev machines.

name: Generate Test Cases

on:
  repository_dispatch:
    types: [ai-test-generate]
  workflow_dispatch:
    inputs:
      issue_key:
        description: Jira issue key (e.g. PROJ-123)
        required: true
        type: string

concurrency:
  group: generate-test-cases-${{ github.event.inputs.issue_key || github.event.client_payload.issue_key }}
  cancel-in-progress: false

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ISSUE_KEY: ${{ github.event.inputs.issue_key || github.event.client_payload.issue_key }}
      # Instance URLs: repository Variables only (not Secrets)—see docs/GITHUB_SECRETS.md
      JIRA_URL: ${{ vars.JIRA_URL }}
      CONFLUENCE_URL: ${{ vars.CONFLUENCE_URL }}
      JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      CONFLUENCE_USER_EMAIL: ${{ secrets.CONFLUENCE_USER_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
    steps:
      - name: Validate issue key
        run: |
          if [ -z "${ISSUE_KEY}" ]; then
            echo "ISSUE_KEY is required (repository_dispatch client_payload.issue_key or workflow_dispatch input)."
            exit 1
          fi
          if ! echo "${ISSUE_KEY}" | grep -qE '^[A-Z][A-Z0-9_]+-[0-9]+$'; then
            echo "ISSUE_KEY must look like PROJ-123"
            exit 1
          fi
          echo "ISSUE_KEY=${ISSUE_KEY}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Jira credentials
        run: |
          if [ -z "${JIRA_URL}" ]; then
            echo "Set repository variable JIRA_URL (e.g. https://jira.example.com) under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [ -z "${JIRA_USERNAME}" ] || [ -z "${JIRA_API_TOKEN}" ]; then
            echo "Set repository secrets JIRA_USERNAME and JIRA_API_TOKEN for Jira read/write."
            exit 1
          fi

      - name: Jira read/write check and pipeline start comment
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/jira-pipeline-start.js

      - name: Verify Figma API access
        run: set -euo pipefail && node scripts/verify-figma-access.js

      - name: Generate MCP config from template
        env:
          CONTAINER_CMD: docker
        run: |
          set -euo pipefail
          docker pull ghcr.io/sooperset/mcp-atlassian:latest
          docker pull docker.io/acuvity/mcp-server-figma:latest
          node scripts/render-mcp-config.js
          mkdir -p "${HOME}/.cursor"
          cp .cursor/mcp.json "${HOME}/.cursor/mcp.json"
          if grep -q '\${' "${HOME}/.cursor/mcp.json"; then
            echo "::error::MCP config still contains unresolved \${...} placeholders"
            exit 1
          fi
          echo "MCP config written to .cursor/mcp.json and ${HOME}/.cursor/mcp.json (contents not logged)."

      - name: Resolve STORY_KEY (Sub-task → parent story)
        run: node scripts/resolve-output-key.js >> "$GITHUB_ENV"

      - name: Install Cursor Agent CLI
        run: |
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare output directory
        run: mkdir -p "generated/jira-tests/${STORY_KEY}"

      - name: Log workspace layout before Cursor Agent (MCP check)
        env:
          STORY_KEY: ${{ env.STORY_KEY }}
        run: |
          echo "::group::Repository root"
          pwd
          ls -la
          echo "::endgroup::"
          echo "::group::.cursor (filenames only—do not log mcp.json contents)"
          ls -la .cursor
          echo "::endgroup::"
          echo "::group::prompts"
          ls -la prompts
          echo "::endgroup::"
          echo "::group::generated/jira-tests/${STORY_KEY}"
          ls -la "generated/jira-tests/${STORY_KEY}"
          echo "::endgroup::"
          echo "::group::MCP config"
          if [ -f .cursor/mcp.json ]; then
            echo "mcp.json: present ($(wc -c < .cursor/mcp.json | tr -d ' ') bytes; contents omitted—contains secrets)"
          else
            echo "::error::.cursor/mcp.json is missing after Generate MCP config"
            exit 1
          fi
          echo "::endgroup::"
          echo "::group::User MCP config (CLI)"
          if [ -f "${HOME}/.cursor/mcp.json" ]; then
            echo "~/.cursor/mcp.json: present ($(wc -c < "${HOME}/.cursor/mcp.json" | tr -d ' ') bytes; contents omitted)"
          else
            echo "::warning::~/.cursor/mcp.json missing after copy"
          fi
          echo "::endgroup::"

      - name: Run Cursor Agent (headless)
        env:
          CI: "true"
          CURSOR_AGENT_MODEL: ${{ vars.CURSOR_AGENT_MODEL }}
          STORY_KEY: ${{ env.STORY_KEY }}
          ISSUE_KEY: ${{ env.ISSUE_KEY }}
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "CURSOR_API_KEY secret is not set."
            exit 1
          fi
          if command -v cursor-agent >/dev/null 2>&1; then
            AGENT_BIN=cursor-agent
          elif command -v agent >/dev/null 2>&1; then
            AGENT_BIN=agent
          else
            echo "Cursor Agent CLI not found on PATH after install."
            exit 1
          fi
          echo "STORY_KEY=${STORY_KEY} (output dir) ISSUE_KEY=${ISSUE_KEY} (workflow target)"
          MODEL="$(node scripts/resolve-cursor-agent-model.js)"
          PROMPT="$(node scripts/build-ci-prompt.js)"
          # Visible in the Actions UI (annotations) right before CLI requests start.
          echo "::notice title=Cursor Agent CLI::Starting headless run with model: ${MODEL}"
          echo "Cursor Agent CLI: streaming run log (JSON lines; partial text deltas when the CLI emits them)."
          # Non-interactive CI: --trust = workspace; --approve-mcps + --force = no UI to approve MCP servers.
          # stream-json + stream-partial-output flushes progress to the job log instead of buffering until exit.
          "${AGENT_BIN}" --trust --approve-mcps --force --model "${MODEL}" -p "${PROMPT}" --print \
            --output-format stream-json --stream-partial-output

      # Missing tests.json here usually means Jira MCP read failed, gate failed, or the agent errored before writing output.
      - name: Verify MCP created all Test issues in Jira
        run: node scripts/verify-mcp-jira.js "${STORY_KEY}"

      - name: Log generated test cases to job log
        if: always()
        run: |
          for KEY in "${STORY_KEY}" "${ISSUE_KEY}"; do
            [ -z "${KEY}" ] && continue
            DIR="generated/jira-tests/${KEY}"
            if [ -f "${DIR}/tests.json" ]; then
              echo "::group::Generated test cases (${KEY})"
              echo "--- tests.json ---"
              python3 -m json.tool "${DIR}/tests.json" 2>/dev/null || cat "${DIR}/tests.json"
              if [ -f "${DIR}/meta.json" ]; then
                echo ""
                echo "--- meta.json ---"
                python3 -m json.tool "${DIR}/meta.json" 2>/dev/null || cat "${DIR}/meta.json"
              fi
              echo "::endgroup::"
              exit 0
            fi
          done
          echo "No generated/jira-tests/.../tests.json found to log."

      - name: Upload generated output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-jira-tests-${{ env.ISSUE_KEY }}
          path: generated/jira-tests/
          if-no-files-found: ignore

      - name: Notify Jira on failure
        if: failure()
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/notify-jira-failure.js

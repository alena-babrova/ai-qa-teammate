# Cursor Agent CLI (cursor-agent) runs ONLY in this GitHub Actions workflow.
# Locally, use Cursor IDE with .cursor/rules and .cursor/mcp.json — do not run headless agent on dev machines.

name: Generate Test Cases

on:
  repository_dispatch:
    types: [ai-test-generate]
  workflow_dispatch:
    inputs:
      issue_key:
        description: Jira issue key (PROJ-123) or browse URL (…/browse/PROJ-123)
        required: true
        type: string
      project:
        description: Optional project pack (e.g. EPMRPP uses projects/EPMRPP/ when that folder exists)
        required: false
        type: string
      cursor_model:
        description: Cursor Agent LLM
        required: true
        type: choice
        default: composer-2.5
        options:
          - composer-2.5
          - composer-2
          - gpt-5.5-high
          - claude-4.6-sonnet-medium
          - claude-opus-4-7-thinking-high

concurrency:
  group: generate-test-cases-${{ github.event.inputs.issue_key || github.event.client_payload.issue_key }}
  cancel-in-progress: false

jobs:
  generate-and-verify:
    name: Generate Test Cases
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ISSUE_KEY: ${{ github.event.inputs.issue_key || github.event.client_payload.issue_key }}
      PROJECT: ${{ github.event.inputs.project || github.event.client_payload.project || github.event.inputs.project_pack || github.event.client_payload.project_pack }}
      # Instance URLs: repository Variables only (not Secrets)—see docs/GITHUB_SECRETS.md
      JIRA_URL: ${{ vars.JIRA_URL }}
      CONFLUENCE_URL: ${{ vars.CONFLUENCE_URL }}
      JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      CONFLUENCE_USER_EMAIL: ${{ secrets.CONFLUENCE_USER_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      GITLAB_API_URL: ${{ vars.GITLAB_API_URL }}
      GITLAB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GITLAB_PERSONAL_ACCESS_TOKEN }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      # Precedence: manual workflow input → repository_dispatch client_payload.cursor_model → repo variable → composer-2.5
      CURSOR_AGENT_MODEL: ${{ github.event.inputs.cursor_model || github.event.client_payload.cursor_model || vars.CURSOR_AGENT_MODEL || 'composer-2.5' }}
    steps:
      # --- Phase 1: verify configuration ---
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: "1. Verify — issue key or Jira browse URL"
        run: |
          if [ -z "${ISSUE_KEY}" ]; then
            echo "ISSUE_KEY is required (workflow input or repository_dispatch client_payload.issue_key)."
            exit 1
          fi
          LINE="$(node scripts/normalize-issue-input.js)"
          echo "${LINE}" >> "${GITHUB_ENV}"
          echo "Normalized: ${LINE}"

      - name: "1. Verify — Jira variables and secrets"
        run: |
          if [ -z "${JIRA_URL}" ]; then
            echo "Set repository variable JIRA_URL (e.g. https://jira.example.com) under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [ -z "${JIRA_USERNAME}" ] || [ -z "${JIRA_API_TOKEN}" ]; then
            echo "Set repository secrets JIRA_USERNAME and JIRA_API_TOKEN for Jira read access."
            exit 1
          fi

      - name: "1. Verify — Cursor API key"
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "CURSOR_API_KEY secret is not set."
            exit 1
          fi

      - name: "1. Verify — Jira read access (read-only pipeline)"
        run: node scripts/verify-jira-access.js

      - name: "1. Verify — Figma API access"
        run: set -euo pipefail && node scripts/verify-figma-access.js

      - name: "1. Verify — Generate MCP config from template"
        env:
          CONTAINER_CMD: docker
        run: |
          set -euo pipefail
          docker pull ghcr.io/sooperset/mcp-atlassian:latest
          docker pull docker.io/acuvity/mcp-server-figma:latest
          docker pull docker.io/mcp/gitlab:latest
          node scripts/render-mcp-config.js
          mkdir -p "${HOME}/.cursor"
          cp .cursor/mcp.json "${HOME}/.cursor/mcp.json"
          if grep -q '\${' "${HOME}/.cursor/mcp.json"; then
            echo "::error::MCP config still contains unresolved \${...} placeholders"
            exit 1
          fi
          echo "MCP config written to .cursor/mcp.json and ${HOME}/.cursor/mcp.json (contents not logged)."

      # --- Phase 2: generate tests (same runner — reuses mcp.json above) ---
      - name: "2. Generate — resolve STORY_KEY (Sub-task → parent story)"
        run: node scripts/resolve-output-key.js >> "$GITHUB_ENV"

      - name: "2. Generate — install Cursor Agent CLI"
        run: |
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "2. Generate — prepare output directory"
        run: mkdir -p "generated/jira-tests/${STORY_KEY}"

      - name: "2. Generate — extract requirement signals (GA / linked specs)"
        env:
          STORY_KEY: ${{ env.STORY_KEY }}
        run: node scripts/extract-requirement-signals.js

      - name: "2. Generate — run Cursor Agent (headless)"
        env:
          CI: "true"
          STORY_KEY: ${{ env.STORY_KEY }}
          ISSUE_KEY: ${{ env.ISSUE_KEY }}
        run: |
          if command -v cursor-agent >/dev/null 2>&1; then
            AGENT_BIN=cursor-agent
          elif command -v agent >/dev/null 2>&1; then
            AGENT_BIN=agent
          else
            echo "Cursor Agent CLI not found on PATH after install."
            exit 1
          fi
          echo "STORY_KEY=${STORY_KEY} (output dir) ISSUE_KEY=${ISSUE_KEY} (workflow target)"
          MODEL="$(node scripts/resolve-cursor-agent-model.js)"
          PROMPT="$(node scripts/build-ci-prompt.js)"
          echo "::notice title=Cursor Agent CLI::Starting headless run with model: ${MODEL}"
          echo "Cursor Agent CLI: streaming run log (JSON lines; partial text deltas when the CLI emits them)."
          "${AGENT_BIN}" --trust --approve-mcps --force --model "${MODEL}" -p "${PROMPT}" --print \
            --output-format stream-json --stream-partial-output

      - name: "2. Generate — verify generated test cases"
        run: node scripts/verify-generated-tests.js "${STORY_KEY}"

      - name: Publish generated test cases to job summary
        if: always()
        run: |
          for KEY in "${STORY_KEY}" "${ISSUE_KEY}"; do
            [ -z "${KEY}" ] && continue
            FILE="generated/jira-tests/${KEY}/${KEY}-test-cases.md"
            if [ -f "${FILE}" ]; then
              cat "${FILE}" >> "${GITHUB_STEP_SUMMARY}"
              echo "::group::Generated test cases (${KEY})"
              cat "${FILE}"
              echo "::endgroup::"
              exit 0
            fi
          done
          echo "No generated/jira-tests/.../<KEY>-test-cases.md found to log."

      - name: Upload generated test cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-jira-tests-${{ env.ISSUE_KEY }}
          path: generated/jira-tests/
          if-no-files-found: ignore
